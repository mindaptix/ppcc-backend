name: ppcc
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ppcc
      POSTGRES_USER: ppcc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ppcc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppcc_app -d ppcc"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile.ppcc
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  ppcc_postgres_data:
